pre-commit:
  commands:
    oxc:
      glob: '**/*.{cjs,cts,js,json,md,mjs,mts,ts,yaml,yml}'
      run: bun x oxlint --deny-warnings --fix --no-error-on-unmatched-pattern {staged_files} && bun x oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  commands:
    ci:
      run: bun run ci
    publint:
      run: bun x publint
